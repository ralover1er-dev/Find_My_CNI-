name: Unzip Project
on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: List files
        run: ls -la
        
      - name: Unzip ANY zip
        run: |
          unzip *.zip -d .
          rm *.zip
          
      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Unzip project" || echo "no changes"
          git push
