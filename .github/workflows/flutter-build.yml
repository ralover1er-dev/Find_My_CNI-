name: Build Flutter App V21 DEBUG
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Find My CNI/find_my_cni_flutter"
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - run: flutter clean
      
      - name: Recreate Android folder
        run: flutter create . --platforms=android  # <-- ÇA RECREE android/
      
      - run: flutter pub get
      - run: flutter build apk --debug
      
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-v21
          path: build/app/outputs/flutter-apk/app-debug.apk
