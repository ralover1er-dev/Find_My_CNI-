name: Build Flutter App
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      
      - name: Create new Flutter project
        run: flutter create find_my_cni_app --platforms=android
      
      - name: Copy lib
        run: cp -r "Find My CNI/find_my_cni_flutter/lib" find_my_cni_app/lib
      
      - name: Copy pubspec
        run: cp "Find My CNI/find_my_cni_flutter/pubspec.yaml" find_my_cni_app/pubspec.yaml
      
      - name: Copy assets
        run: cp -r "Find My CNI/find_my_cni_flutter/assets" find_my_cni_app/assets || echo "no assets"
      
      - name: Force Android to Flutter 3.24 standards
        run: |
          cd find_my_cni_app/android
          # 1. PATCH LE VRAI FICHIER: settings.gradle
          sed -i "s/id 'org.jetbrains.kotlin.android' version '[0-9.]*'/id 'org.jetbrains.kotlin.android' version '1.9.24'/" settings.gradle
          
          # 2. AGP 8.3.0
          sed -i "s/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.3.0/" build.gradle
          
          # 3. compileSdk 34 + namespace
          sed -i 's/compileSdkVersion 33/compileSdkVersion 34/g' app/build.gradle
          sed -i '/android {/a \ namespace "com.example.find_my_cni_app"' app/build.gradle
          
          # 4. Gradle 8.4
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip" > gradle/wrapper/gradle-wrapper.properties
      
      - name: Clean and Install dependencies
        run: |
          cd find_my_cni_app 
          flutter clean
          flutter pub get
      
      - name: Build APK
        run: cd find_my_cni_app && flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: find_my_cni_app/build/app/outputs/flutter-apk/app-release.apk
