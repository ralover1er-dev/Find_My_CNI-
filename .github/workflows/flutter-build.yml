name: Build Flutter App V16 DEBUG
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      
      - run: flutter create find_my_cni_app --platforms=android --org com.findmycni
      - run: cp -r "Find My CNI/find_my_cni_flutter/lib" find_my_cni_app/lib
      - run: cp "Find My CNI/find_my_cni_flutter/pubspec.yaml" find_my_cni_app/pubspec.yaml
      - run: cp -r "Find My CNI/find_my_cni_flutter/assets" find_my_cni_app/assets || echo "no assets"
      
      - name: Fix Android + Kotlin + Gradle 8.4
        run: |
          cd find_my_cni_app/android
          
          # 1. Forcer Gradle 8.4
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip" > gradle/wrapper/gradle-wrapper.properties
          
          # 2. Fix settings.gradle avec Kotlin 1.9.22
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
              def flutterSDKPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSDKPath/packages/flutter_tools/gradle")
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.3.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          include ":app"
          EOF
          
          # 3. Fix build.gradle
          sed -i 's/compileSdkVersion 33/compileSdkVersion 34/g' app/build.gradle
          sed -i '/android {/a \ namespace "com.findmycni.app"' app/build.gradle
      
      - run: cd find_my_cni_app && flutter clean && flutter pub get
      - run: cd find_my_cni_app && flutter build apk --debug
      
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-v16
          path: find_my_cni_app/build/app/outputs/flutter-apk/app-debug.apk
